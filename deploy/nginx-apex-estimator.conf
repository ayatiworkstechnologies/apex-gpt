# Nginx reverse-proxy config for the Apex Construction Estimator API.
# Installed by setup.sh to /etc/nginx/sites-available/apex-estimator and
# symlinked into sites-enabled.
#
# Replace `server_name` with your real domain (or an IP for testing), then
# run `certbot --nginx -d your-domain` afterwards to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # <-- replace with your domain, e.g. estimator.example.com

    client_max_body_size 2m;

    access_log /var/log/nginx/apex-estimator.access.log;
    error_log  /var/log/nginx/apex-estimator.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;    # generous timeout in case PROMPT_PARSER=llm is enabled
    }
}
